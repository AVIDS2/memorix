name: Publish to npm and MCP Registry

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish the npm package before publishing the MCP Registry record"
        required: true
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release tag matches package version
        id: package-version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          expected_ref="refs/tags/v${version}"
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "This workflow must run from ${expected_ref}; got ${GITHUB_REF}." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Checked out commit does not match the workflow SHA." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check:mcp-registry
      - run: npm run build
      - run: npm test
      - name: Publish the npm package
        if: ${{ inputs.publish_npm }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"

          if npm view "memorix@$version" version >/dev/null 2>&1; then
            echo "memorix@$version is already published."
            exit 0
          fi

          set +e
          npm publish --provenance --access public 2>&1 | tee npm-publish.log
          publish_status=${PIPESTATUS[0]}
          set -e

          if [ "$publish_status" -ne 0 ]; then
            visible=false
            for delay in 5 10 20 30 45 60; do
              if npm view "memorix@$version" version 2>/dev/null | grep --quiet "^${version}$"; then
                visible=true
                break
              fi
              echo "Publish returned an error; checking npm again in ${delay}s."
              sleep "$delay"
            done
            if [ "$visible" = true ]; then
              echo "memorix@$version became visible after the publish response."
              publish_status=0
            elif grep --quiet 'TLOG_CREATE_ENTRY_ERROR' npm-publish.log && \
                 grep --quiet 'equivalent entry already exists' npm-publish.log; then
              echo "Sigstore transparency-log duplicate detected; retrying without provenance."
              npm publish --access public --ignore-scripts
              publish_status=0
            fi
          fi

          exit "$publish_status"
      - name: Wait for npm package visibility
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          set -euo pipefail
          for delay in 5 10 20 30 45 60; do
            if npm view "memorix@$PACKAGE_VERSION" version 2>/dev/null | grep --quiet "^${PACKAGE_VERSION}$"; then
              echo "memorix@$PACKAGE_VERSION is visible in npm."
              exit 0
            fi
            echo "memorix@$PACKAGE_VERSION is not visible yet; waiting ${delay}s."
            sleep "$delay"
          done
          echo "memorix@$PACKAGE_VERSION did not become visible in npm." >&2
          exit 1
      - name: Install the official MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: 1.8.0
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output checksums.txt "$base_url/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          grep " $archive$" checksums.txt | sha256sum --check --
          tar --extract --gzip --file "$archive"
          install --mode 0755 mcp-publisher /usr/local/bin/mcp-publisher
      - name: Publish to the official MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish server.json
