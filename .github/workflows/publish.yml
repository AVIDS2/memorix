name: Publish to npm and MCP Registry

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish the npm package before publishing the MCP Registry record"
        required: true
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check:mcp-registry
      - run: npm run build
      - run: npm test
      - name: Publish the npm package
        if: ${{ inputs.publish_npm }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"

          if npm view "memorix@$version" version >/dev/null 2>&1; then
            echo "memorix@$version is already published; continuing with Registry publication."
            exit 0
          fi

          set +e
          npm publish --provenance --access public 2>&1 | tee npm-publish.log
          publish_status=${PIPESTATUS[0]}
          set -e

          if [ "$publish_status" -eq 0 ]; then
            exit 0
          fi

          if npm view "memorix@$version" version >/dev/null 2>&1; then
            echo "memorix@$version became visible after the publish response; continuing."
            exit 0
          fi

          if grep --quiet 'TLOG_CREATE_ENTRY_ERROR' npm-publish.log && \
             grep --quiet 'equivalent entry already exists' npm-publish.log; then
            echo "Sigstore transparency-log duplicate detected; retrying the already verified package without provenance."
            npm publish --access public --ignore-scripts
            exit 0
          fi

          exit "$publish_status"
      - name: Install the official MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: 1.8.0
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output checksums.txt "$base_url/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          grep " $archive$" checksums.txt | sha256sum --check --
          tar --extract --gzip --file "$archive"
          install --mode 0755 mcp-publisher /usr/local/bin/mcp-publisher
      - name: Publish to the official MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish server.json
