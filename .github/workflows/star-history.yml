name: Update star history chart

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate self-hosted star history assets
        run: node scripts/generate-star-history.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit changed assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.json assets/star-history-light.svg assets/star-history-dark.svg
          git diff --cached --quiet && exit 0
          git switch -C automation/star-history
          git commit -m "docs: update star history chart [skip ci]"
          git push --force origin HEAD:automation/star-history

          pr_number="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head automation/star-history \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -z "${pr_number}" ]; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head automation/star-history \
              --title "docs: update star history chart" \
              --body "Automated refresh of the self-hosted star history assets."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
